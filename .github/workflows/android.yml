name: Android

on:
  push:
    branches: ["android/on-device"]
    paths:
      - "android/**"
      - "server/aitutor_server/static/**"   # SPA is copied into the app
      - "server/aitutor_server/gemini/prompts/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - "server/aitutor_server/static/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-tests:
    name: core unit tests (no SDK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Run core tests
        working-directory: android/core
        run: gradle test --no-daemon --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-test-report
          path: android/core/build/reports/tests/test

  build-apk:
    name: build debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to publish the Release asset
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Assemble debug APK (Phase-1 stub)
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon --stacktrace --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      # Publish to a Release so the APK is downloadable directly on a phone
      # (the GitHub mobile app can't download Actions artifacts).
      - name: Publish APK to Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Android debug APK (latest)
          prerelease: true
          body: |
            Latest debug build of the on-device Android app (Phase-1 stub:
            full UI + camera + RAM recommendation, placeholder grades).
            Download **app-debug.apk** below and install on the phone.
          files: android/app/build/outputs/apk/debug/app-debug.apk

