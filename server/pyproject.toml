[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aitutor-server"
version = "0.2.0"
description = "Local web server for the PSLE Essay Tutor (Gemini-backed inference)"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.6",

    # Online inference (OCR + picture description + grading) goes to one of two
    # OpenAI-compatible providers -- Gemini or Alibaba Cloud (Qwen) -- so a
    # single OpenAI SDK serves both.
    "openai>=1.40",

    # Server-side image validation / optional downscale of uploads.
    "pillow>=10.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
    "httpx>=0.27",  # For TestClient
]

[tool.setuptools.packages.find]
where = ["."]
include = ["aitutor_server*"]

[tool.setuptools.package-data]
aitutor_server = ["providers/prompts/*.md", "static/**/*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",  # Long lines OK; we already cap at 110
    "B008",  # FastAPI dependency-injection idiom: File()/Form() in defaults
]

[tool.pytest.ini_options]
testpaths = ["tests"]
